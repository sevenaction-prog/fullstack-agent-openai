[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullstack-agent-openai"
version = "0.1.0"
description = "A local-first personal agent runtime powered by the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sevenaction-prog"}]
dependencies = [
  "openai>=1.0.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
voice = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "httpx>=0.27.0"]

[project.scripts]
fullstack-agent = "fullstack_agent_openai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
